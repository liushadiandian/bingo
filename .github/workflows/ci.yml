name: ci
on:
  push:
    branches: ['validation/**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  fmt-and-discipline:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: scripts/check_discipline.sh
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'Linux'
        with: { node-version: '24.17.0' }
      - run: node --test sdk/typescript/src/*.test.ts
        if: runner.os == 'Linux'
      - run: cargo test -p bingo --test plugin_kit --locked -- --nocapture --test-threads=2
        if: runner.os == 'Linux'
        env: { BINGO_REQUIRE_NODE: '1' }
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Half the runner's vCPUs: the gateway and peers suites spawn real
      # subprocesses, so each test thread can cost more than one core, and
      # the shared runner has fewer to begin with than a developer's machine.
      - run: cargo test --workspace --locked -- --test-threads=2
  tui-smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      - run: cargo build --locked
      - run: scripts/tui-smoke.sh
  windows:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Blocking. "Every platform the release ships" is a rule about building,
      # and a Windows build breaking is the build breaking: a unix-only API
      # written without its counterpart fails here and nowhere else.
      - run: cargo check --workspace --all-targets --locked
      # No developer runs these, so a run names every failure, not only the
      # first failing binary's.
      - run: cargo test --workspace --locked --no-fail-fast -- --test-threads=2
  deny:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  budget:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --timings
      - run: scripts/budget.sh
      - uses: actions/upload-artifact@v4
        with: { name: cargo-timings, path: target/cargo-timings/ }
